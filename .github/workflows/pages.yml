name: Deploy God Way to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare versioned PWA
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          python3 - <<'PY'
          from pathlib import Path
          import json, os, datetime

          index = Path('_site/index.html')
          html = index.read_text(encoding='utf-8')
          tags = [
              '<script src="./radar-patch.js" defer></script>',
              '<script src="./ritual.js" defer></script>',
              '<script src="./pwa-runtime.js" defer></script>'
          ]
          for tag in tags:
              if tag not in html:
                  if '</body>' in html:
                      html = html.replace('</body>', tag + '\n</body>', 1)
                  else:
                      html += '\n' + tag + '\n'
          index.write_text(html, encoding='utf-8')

          tarot = Path('_site/tarot.html')
          tarot_html = tarot.read_text(encoding='utf-8')
          tarot_tag = '<script src="./tarot-art-local.js"></script>'
          if tarot_tag not in tarot_html:
              runtime_tag = '<script src="./pwa-runtime.js" defer></script>'
              if runtime_tag in tarot_html:
                  tarot_html = tarot_html.replace(runtime_tag, tarot_tag + '\n' + runtime_tag, 1)
              elif '</body>' in tarot_html:
                  tarot_html = tarot_html.replace('</body>', tarot_tag + '\n</body>', 1)
              else:
                  tarot_html += '\n' + tarot_tag + '\n'
          tarot.write_text(tarot_html, encoding='utf-8')

          sha = os.environ.get('GITHUB_SHA', 'unknown')
          run = os.environ.get('GITHUB_RUN_NUMBER', '0')
          version = {
              'version': '5.7.0',
              'build': f'{sha}-{run}',
              'sha': sha,
              'run': run,
              'channel': 'stable',
              'features': [
                  'field-sensors','am-fm-sweep','evp','question-protocol','ritual-pact',
                  'summoning-ritual','anomaly-scope','motion-six-axis','motion-live-waveform',
                  'pixel-tarot','qimen-eight-gates','qimen-nine-palaces','qimen-yin-yang-ju',
                  'qimen-zhi-shi','qimen-purpose-reading','auto-update-pwa'
              ],
              'updatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          Path('_site/version.json').write_text(json.dumps(version, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Validate JavaScript and bundles
        shell: bash
        run: |
          node --check _site/radar-patch.js
          node --check _site/ritual.js
          node --check _site/motion-patch.js
          node --check _site/tarot-art-local.js
          node --check _site/pwa-runtime.js
          node --check _site/sw.js
          grep -q "GODWAY_MOTION_PRO" _site/motion-patch.js
          grep -q "pixel-canvas" _site/tarot.html
          grep -q "Wikimedia" _site/tarot-art-local.js
          grep -q "QIMEN · EIGHT GATES" _site/qimen.html
          grep -q "值使" _site/qimen.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
